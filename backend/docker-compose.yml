services:
  server-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pc-api
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DEBUG=true
      - SECRET_KEY=your-secret-key-change-this-in-production
      - DATABASE_URL=sqlite:///./data/project_corridor.db
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=nimda
      # instance Manager connection
      - instance_MANAGER_URL=http://instance-api:8081
    volumes:
      - ./api_data:/app/data
    depends_on:
      - instance-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  instance-api:
    build:
      context: ./instance_api
      dockerfile: Dockerfile
    container_name: pc-instance-manager
    ports:
      - "8081:8081"
      # Expose port range for Godot servers
      - "9000-9100:9000-9100"
    environment:
      - HOST=0.0.0.0
      - PORT=8081
      - DEBUG=true
      - GODOT_SERVER_EXECUTABLE=/app/project-corridor_server.x86_64
      - GODOT_PROJECT_PATH=/app/godot_server
      - instance_PORT_RANGE_START=9000
      - instance_PORT_RANGE_END=9100
      - MAX_instanceS=50
      - HUB_instance_NAME=player_hub
      - HUB_MAX_PLAYERS=100
      - USE_DOCKER=false
      - DOCKER_IMAGE=project-corridor/godot-server:latest
      - DOCKER_NETWORK=project-corridor_default
    volumes:
      # Mount Docker socket for container management if USE_DOCKER=true
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount shared memory for better performance
      - /dev/shm:/dev/shm
      # Mount the Godot project files
      - ../godot:/app/godot_server:ro
      # Mount the exported server executable if it exists
      - ./instance_api/app/project-corridor_server.x86_64:/app/project-corridor_server.x86_64:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  corridor_data:
    driver: local
